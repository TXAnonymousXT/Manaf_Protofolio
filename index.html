<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mycelial Network Portfolio</title>
    <script type="module" crossorigin src="./assets/index-3PQjaL13.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-8XY-UAzh.css">
    <style>
      /* ═══ MORPHING ANIMATIONS ═══ */

      /* Morph Reveal — clip-path polygon reveal on scroll */
      .morph-reveal {
        clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
        transition: clip-path 1s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .morph-reveal.visible {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

      /* Morph Glitch — chromatic aberration on elements */
      @keyframes morphGlitchCyan {
        0%, 85%, 100% { opacity: 0; transform: translate(0, 0); }
        87% { opacity: 0.7; transform: translate(-3px, 1px); }
        89% { opacity: 0; }
        91% { opacity: 0.5; transform: translate(2px, -1px); }
        93% { opacity: 0; }
      }
      @keyframes morphGlitchRed {
        0%, 86%, 100% { opacity: 0; transform: translate(0, 0); }
        88% { opacity: 0.7; transform: translate(3px, -1px); }
        90% { opacity: 0; }
        92% { opacity: 0.5; transform: translate(-2px, 1px); }
        94% { opacity: 0; }
      }

      /* Morph Blob — border-radius organic shape shift on hover */
      .spore-sac {
        transition: border-radius 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
      }
      .spore-sac:hover {
        border-radius: 4px 20px 4px 20px !important;
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 0 30px rgba(0, 255, 209, 0.15), 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      /* Morph Glow — rotating conic gradient border on hover */
      @property --glow-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      @keyframes rotateGlow {
        to { --glow-angle: 360deg; }
      }

      /* Morph Stagger — enhanced reveal animations */
      .reveal-item {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
        transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .reveal-item.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      /* Chromatic glitch on headings */
      h1, h2 {
        position: relative;
      }
      h1::before, h2::before {
        content: '';
        position: absolute;
        inset: 0;
        background: inherit;
        color: #00ffd1;
        z-index: -1;
        animation: morphGlitchCyan 8s ease-in-out infinite;
        pointer-events: none;
      }

      /* Page transition wipe */
      .page-transition-wipe {
        position: fixed;
        inset: 0;
        z-index: 10002;
        background: #04070f;
        clip-path: circle(0% at 50% 50%);
        transition: clip-path 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }
      .page-transition-wipe.active {
        clip-path: circle(150% at 50% 50%);
      }

      /* Smooth button morph */
      button, a {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      button:hover, a:hover {
        transform: translateY(-2px);
      }

      /* Canvas glow pulse */
      canvas {
        filter: contrast(1.05) brightness(1.02);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Morphing animation: IntersectionObserver for reveal-items
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const observer = new IntersectionObserver(entries => {
            entries.forEach((e, i) => {
              if (e.isIntersecting) {
                setTimeout(() => e.target.classList.add('visible'), i * 80);
                observer.unobserve(e.target);
              }
            });
          }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

          document.querySelectorAll('.reveal-item').forEach(el => observer.observe(el));
        }, 500);
      });
    </script>
  </body>
</html>
